<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MES Nhật Phát</title>
<script src="/target.js"></script>
<script>
  // Moi duong dan khac (vd /login, /part-master) deu duoc chuyen sang link MES hien tai
  (function () {
    var t = window.MES_TARGET || "";
    if (!t) return;
    location.replace(t + location.pathname + location.search + location.hash);
  })();
</script>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; margin: 0; color: #333; background: #f7f7f7; }
  .box { text-align: center; padding: 24px; }
  a { color: #1a73e8; }
</style>
</head>
<body>
  <div class="box">
    <h2>MES Nhật Phát</h2>
    <p>Đang chuyển đến hệ thống...</p>
    <p><a id="go" href="#">Bấm vào đây nếu không tự chuyển</a></p>
  </div>
  <script>
    var a = document.getElementById("go");
    if (window.MES_TARGET) a.href = window.MES_TARGET;
  </script>
</body>
</html>
